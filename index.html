<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tuandung4090</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- CHẤM ĐEN CON TRỎ CHUỘT -->
    <div id="custom-cursor"></div>

    <!-- MÀN HÌNH CHỜ (INTRO) -->
    <div id="intro-screen">
        <div id="intro-overlay"></div> 
        
        <div class="terminal" id="terminal-window">
            <div class="mac-header">
                <span class="mac-title">Status</span>
                <div class="mac-buttons">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
            </div>
            
            <div class="terminal-body">
                <div id="typing-text">
                    <div>LOADING ASSETS... <span id="loading-percent">0</span>%</div>
                    <div id="system-ready" style="opacity: 0;">SYSTEM READY<span class="cursor">_</span></div>
                </div>
                <button id="enter-btn" style="opacity: 0; pointer-events: none;">CLICK TO ENTER</button>
            </div>
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH (MAIN BIO) -->
    <div class="container" id="main-content">
        <!-- KHỐI PROFILE -->
        <div class="glass-card profile-card slide-up">
            <div class="profile-layout">
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img src="dog.jpg" alt="Avatar" class="avatar-main" id="my-avatar">
                        <div class="badge-exclamation">!</div>
                        <div class="anger-symbol">💢</div>
                    </div>
                </div>
                
                <div class="info-section">
                    <h2 id="glitch-name" data-value="tuandung4090">tuandung4090</h2>
                    <p class="desc">cứ thế thôi.<br><b>hihi</b></p>
                    
                    <div class="social-actions">
                        <div class="social-icons">
                            <a href="https://www.facebook.com/n4.tdung?locale=vi_VN" class="sq-btn" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                            <a href="https://discord.gg/CsUShCGvsX" class="sq-btn" target="_blank"><i class="fa-brands fa-discord"></i></a>
                            <a href="https://www.instagram.com/n4_tdung/" class="sq-btn" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                            <a href="mailto:tuandung4090@gmail.com" class="sq-btn"><i class="fa-solid fa-envelope"></i></a>
                            <a href="#" class="sq-btn"><i class="fa-solid fa-mug-hot"></i></a>
                            <a href="#" class="sq-btn"><i class="fa-solid fa-bolt"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- KHỐI DISCORD -->
        <div class="discord-row slide-up" style="animation-delay: 0.1s;">
            <div class="glass-card mini-card discord-user">
                <div class="mini-header">
                    <div class="mini-avatar-box">
                        <img src="dog2.jpg" alt="User">
                        <div class="status-dot dnd"></div>
                    </div>
                    <div class="mini-info">
                        <h4>! tuandung4090 <span class="cf-badge"> D10</span></h4>
                        <span class="username">@tuandung4090</span>
                    </div>
                </div>
                <p class="custom-status">hihi</p>
                <button class="action-btn">View Profile</button>
            </div>

            <div class="glass-card mini-card discord-server">
                <div class="mini-header">
                    <img src="d10.jpg" alt="Server" class="server-icon">
                    <div class="mini-info">
                        <h4> D10 FAMILY</h4>
                        <div class="server-stats">
                            <span class="stat-dot green"></span> 43 Online
                            <span class="stat-dot grey"></span> 243 Members
                        </div>
                    </div>
                </div>
                <a href="https://discord.gg/CsUShCGvsX" target="_blank" class="action-btn" style="text-decoration: none; text-align: center; display: block; box-sizing: border-box;">Join</a>
            </div>
        </div>
        
        <!-- THẺ AUDIO ẨN ĐỂ PHÁT NHẠC NỀN -->
        <audio id="my-audio" src="Legends Never Die.mp3" loop></audio>
    </div>

    <script>
        // =========================================
        // 1. HIỆU ỨNG CON TRỎ CHUỘT
        // =========================================
        const customCursor = document.getElementById('custom-cursor');

        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mousedown', () => {
            customCursor.style.transform = 'translate(-50%, -50%) scale(0.8)';
        });
        document.addEventListener('mouseup', () => {
            customCursor.style.transform = 'translate(-50%, -50%) scale(1)';
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // =========================================
        // 2. MÀN HÌNH INTRO & TERMINAL (Bao gồm kích hoạt nhạc)
        // =========================================
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('main-content');
        const enterBtn = document.getElementById('enter-btn');
        const introOverlay = document.getElementById('intro-overlay'); 
        const terminalWindow = document.getElementById('terminal-window'); 
        const percentEl = document.getElementById('loading-percent');
        const systemReadyEl = document.getElementById('system-ready');
        const bgAudio = document.getElementById('my-audio'); 

        let count = 0;
        let loader = setInterval(() => {
            count++;
            if(percentEl) percentEl.innerText = count;
            if (count >= 100) {
                clearInterval(loader);
                if(systemReadyEl) systemReadyEl.style.opacity = '1';
                if(enterBtn) {
                    enterBtn.style.opacity = '1';
                    enterBtn.style.pointerEvents = 'auto';
                }
            }
        }, 20); 

        enterBtn.addEventListener('mouseenter', () => {
            if(introOverlay) introOverlay.style.opacity = '0';
            if(terminalWindow) terminalWindow.classList.add('glass-mode'); 
        });

        enterBtn.addEventListener('mouseleave', () => {
            if(introOverlay) introOverlay.style.opacity = '1';
            if(terminalWindow) terminalWindow.classList.remove('glass-mode'); 
        });

        enterBtn.addEventListener('click', () => {
            introScreen.classList.add('genie-effect'); 
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                
                bgAudio.volume = 0.6; 
                bgAudio.play().catch(e => console.log("Trình duyệt chặn auto-play: ", e));
            }, 600);
        });

        // =========================================
        // 3. HIỆU ỨNG GIẬT CHỮ
        // =========================================
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz!@#$%^&*";
        const glitchElement = document.getElementById('glitch-name');
        
        function glitchText() {
            let iterations = 0;
            const originalText = glitchElement.dataset.value;
            const interval = setInterval(() => {
                glitchElement.innerText = originalText.split("")
                    .map((letter, index) => {
                        if(index < iterations) return originalText[index];
                        return letters[Math.floor(Math.random() * letters.length)];
                    }).join("");
                if(iterations >= originalText.length) clearInterval(interval);
                iterations += 1 / 3;
            }, 30);
        }
        setInterval(glitchText, 3000);
    </script>
</body>
</html>
