        function playTrack() {
            if (loadedTrackIndex !== currentTrackIndex) {
                audio.src = playlist[currentTrackIndex].src;
                document.getElementById('track-title').innerText = playlist[currentTrackIndex].title + " - " + playlist[currentTrackIndex].artist;
                document.getElementById('track-cover').src = playlist[currentTrackIndex].cover;
                currentLyricIndex = -1;
                lyricsEl.innerText = "Đang tải lời bài hát...";
                lyricsEl.classList.remove('active');
                loadedTrackIndex = currentTrackIndex;
            }
            audio.play();
            isPlaying = true;
            playBtn.innerHTML = '⏸';
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack();
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack();
        });

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '▶';
        }

        playBtn.addEventListener('click', () => {
            isPlaying ? pauseTrack() : playTrack();
        });
        
        volDownBtn.addEventListener('click', () => {
            if(audio.volume > 0.1) audio.volume -= 0.1;
            else audio.volume = 0;
        });

        volUpBtn.addEventListener('click', () => {
            if(audio.volume < 0.9) audio.volume += 0.1;
            else audio.volume = 1;
        });

        audio.addEventListener('loadedmetadata', () => {
            let min = Math.floor(audio.duration / 60);
            let sec = Math.floor(audio.duration % 60);
            totalTimeEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            if(!isNaN(percent)) progress.style.width = `${percent}%`;
            
            let min = Math.floor(audio.currentTime / 60);
            let sec = Math.floor(audio.currentTime % 60);
            currentTimeEl.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;

            let currentLyrics = [];
            if (currentTrackIndex === 0) currentLyrics = lyricsData;
            else if (currentTrackIndex === 1) currentLyrics = lyricsData_VnLowG;
            
            if (currentLyrics.length === 0) {
                lyricsEl.innerText = "Enjoy the music~";
                return;
            }
            
            let timeToCompare = audio.currentTime; 
            let nextIndex = currentLyrics.findIndex(lyric => lyric.time > timeToCompare);
            let activeIndex = nextIndex === -1 ? currentLyrics.length - 1 : nextIndex - 1;

            if (activeIndex !== currentLyricIndex && activeIndex >= 0) {
                currentLyricIndex = activeIndex;
                lyricsEl.classList.remove('active');
                
                setTimeout(() => {
                    lyricsEl.innerText = currentLyrics[currentLyricIndex].text;
                    lyricsEl.classList.add('active');
                }, 150); 
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
            if (!isPlaying) playTrack();
        });
    </script>
